name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python py_compile + pytest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: py_compile — весь проект (ловим SyntaxError рано)
        run: |
          python -m compileall -q app scripts admin_app.py scheduler.py tests

      - name: pytest — RLS + уведомления + тэги/копирование
        env:
          ASYNC_DB_DSN: "sqlite+aiosqlite:///:memory:"
          DB_DSN: "sqlite:///:memory:"
          JWT_SECRET: "test_jwt_secret_32_chars_min_______"
          SMTP_HOST: ""
          CORS_ORIGINS: "http://testserver"
        run: pytest tests/ -v --tb=short

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Build
        working-directory: frontend
        run: npm run build
